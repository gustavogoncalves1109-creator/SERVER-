
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="menu">
            <a href="index.html" class="link-menu">Home</a>
            <a href="galeria.html" class="link-menu">Galeria</a>
            <a href="#" class="link-menu abrir-aviso-chat">Chat</a>
            <a href="cadastro.html" class="link-menu">Cadastro</a>
            <a href="login.html" class="link-menu">Login</a>
        </nav>
    </header>

    <main>
        <section class="secao-login">
            <article class="card-login">

                <h1>Login</h1>

                <p class="texto-login">
                    Preencha os campos abaixo para realizar seu login.
                </p>

                <form id="formulario-login">

                    <label for="email">E-mail</label><br>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <br><br>

                    <label for="senha">Senha</label><br>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                    <br><br>

                    <button
                        type="submit"
                        id="btnlogin"
                        class="btn-login"
                    >
                        Entrar
                    </button>

                    <div
                        id="loginMensagem"
                        class="cadMensagem"
                        role="status"
                        aria-live="polite"
                    ></div>

                </form>

            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gustavo Gonçalves Vieira. Todos os direitos reservados.</p>
    </footer>

    <script>
        const formularioLogin = document.querySelector('#formulario-login');
        const campoEmail = document.querySelector('#email');
        const campoSenha = document.querySelector('#senha');
        const btnLogin = document.querySelector('#btnlogin');
        const loginMensagem = document.querySelector('#loginMensagem');

        formularioLogin.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const email = campoEmail.value.trim();
            const senha = campoSenha.value;

            if (!email || !senha) {
                loginMensagem.textContent = 'Preencha todos os campos!';
                return;
            }

            btnLogin.disabled = true;
            loginMensagem.textContent = 'Verificando seus dados...';

            try {
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    loginMensagem.textContent =
                        dados.erro || 'E-mail ou senha incorretos.';
                    return;
                }

                // Guarda o nome recebido do servidor.
                localStorage.setItem('usuario', dados.usuario);

                loginMensagem.textContent =
                    'Login realizado com sucesso! Entrando no chat...';

                // Redireciona para o chat após o login bem-sucedido.
                window.location.href = '/chat.html';

            } catch (erro) {
                console.error('Erro no login:', erro);

                loginMensagem.textContent =
                    'Não foi possível conectar ao servidor. Tente novamente.';
            } finally {
                btnLogin.disabled = false;
            }
        });
    </script>

<!-- Aviso para acessar o chat -->
<div id="avisoChat" class="aviso-chat" role="dialog"
     aria-modal="true" aria-labelledby="tituloAvisoChat"
     aria-describedby="textoAvisoChat" hidden>

    <div class="conteudo-aviso-chat">
        <h2 id="tituloAvisoChat">Um momento, aventureiro!</h2>

        <p id="textoAvisoChat">
            É necessário ter uma conta para acessar o chat.
            Quer fazer o cadastro?
        </p>

        <div class="botoes-aviso-chat">
            <button type="button" id="btnSimChat">
                Sim, fazer cadastro
            </button>

            <button type="button" id="btnNaoChat">
                Não, continuar navegando
            </button>
        </div>
    </div>
</div>

<script>
    const avisoChat = document.querySelector('#avisoChat');
    const btnSimChat = document.querySelector('#btnSimChat');
    const btnNaoChat = document.querySelector('#btnNaoChat');

    document.querySelectorAll('.abrir-aviso-chat').forEach(link => {
        link.addEventListener('click', evento => {
            evento.preventDefault();
            avisoChat.hidden = false;
            btnSimChat.focus();
        });
    });

    btnSimChat.addEventListener('click', () => {
        window.location.href = 'cadastro.html';
    });

    btnNaoChat.addEventListener('click', () => {
        avisoChat.hidden = true;
    });

    avisoChat.addEventListener('click', evento => {
        if (evento.target === avisoChat) {
            avisoChat.hidden = true;
        }
    });

    document.addEventListener('keydown', evento => {
        if (evento.key === 'Escape' && !avisoChat.hidden) {
            avisoChat.hidden = true;
        }
    });
</script>


</body>
</html>
