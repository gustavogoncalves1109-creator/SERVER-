
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho e menu -->
    <header>
        <nav class="menu">
            <a href="index.html" class="link-menu">Home</a>
            <a href="galeria.html" class="link-menu">Galeria</a>
            <a href="chat.html" class="link-menu">Chat</a>
            <a href="cadastro.html" class="link-menu">Cadastro</a>
            <a href="login.html" class="link-menu">Login</a>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Seção de login -->
        <section class="secao-login">

            <!-- Artigo contendo o formulário -->
            <article class="card-login">

                <h1>Login</h1>

                <p class="texto-login">
                    Preencha os campos abaixo para realizar seu login.
                </p>

                <!-- Formulário -->
                <form id="formulario-login">

    

    <label for="email">E-mail</label><br>
    <input type="email" id="email" placeholder="Digite seu e-mail"
    required>

    <label for="senha">Senha</label><br>
    <input type="password" id="senha" placeholder="Digite sua senha"
    required>

    <button id="btnlogin" class="btn-login">Enviar</button>
    <div id="loginMensagem" class="cadMensagem"></div>

                </form>

                <!-- Resposta do servidor -->
                <div id="resposta"></div>

            </article>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>
            &copy; 2026 Gustavo Gonçalves Vieira. Todos os direitos reservados.
        </p>
    </footer>

    <script>
        
const btnLogin = document.querySelector('#btnLogin');
const campoEmail = document.querySelector('#email');
const campoSenha = document.querySelector('#senha');
const loginMensagem = document.querySelector('#loginMensagem');

btnLogin.addEventListener('click', async (evento) => {
    evento.preventDefault();

    const email = campoEmail.value.trim();
    const senha = campoSenha.value;

    if (!email || !senha) {
        loginMensagem.textContent = 'Preencha todos os campos!';
        return;
    }

    btnLogin.disabled = true;
    loginMensagem.textContent = 'Verificando seus dados...';

    try {
        const resposta = await fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, senha })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            loginMensagem.textContent =
                dados.erro || 'E-mail ou senha incorretos.';
            return;
        }

       
        localStorage.setItem('usuario', dados.usuario);

        loginMensagem.textContent = 'Login realizado! Entrando no chat...';

        
        window.location.href = '/chat.html';

    } catch (erro) {
        console.error('Erro no login:', erro);
        loginMensagem.textContent =
            'Não foi possível conectar ao servidor.';
    } finally {
        btnLogin.disabled = false;
    }
});


       
    </script>



</body>
</html>
